services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiConsent\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  Maispace\MaiConsent\Controller\Backend\ConsentStatisticsBackendController:
    public: true

  Maispace\MaiConsent\Command\PurgeExpiredConsentLogsCommand:
    tags:
      - name: console.command
        command: 'consent:purge-expired-logs'
        description: 'Erase consent log entries older than the configured retention period (GDPR cleanup)'
        schedulable: true
