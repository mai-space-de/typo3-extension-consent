services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiConsent\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # DataHandler instantiates hooks via GeneralUtility::makeInstance() - must be public for DI
  Maispace\MaiConsent\Hook\ConsentCategoryCacheInvalidationHook:
    public: true

  Maispace\MaiConsent\Controller\Backend\ConsentStatisticsBackendController:
    public: true

  Maispace\MaiConsent\Command\PurgeExpiredConsentLogsCommand:
    tags:
      - name: console.command
        command: 'consent:purge-expired-logs'
        description: 'Erase consent log entries older than the configured retention period (GDPR cleanup)'
        schedulable: true

  dashboard.widget.maiConsentManual:
    class: 'ProudNerds\PnBackendManual\Widgets\ManualWidget'
    arguments:
      $options:
        file: 'EXT:mai_consent/Resources/Private/Manual/Manual.md'
        numbered: true
        contentsDepth: 2
        printButton: true
    tags:
      - name: dashboard.widget
        identifier: 'maiConsentManual'
        groupNames: 'documentation'
        title: 'Handbuch: Einwilligung'
        description: 'Kurze Anleitung für Cookie-Kategorien und die Statistik.'
        iconIdentifier: 'content-book'
        height: 'medium'
        width: 'medium'
